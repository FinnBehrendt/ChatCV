repos:
  # Reuse the same locked tools and tasks as CI, without separate tool installs.
  - repo: local
    hooks:
      - id: pixi-check
        name: Tests, lint, formatting, types and security (Pixi)
        entry: pixi run --locked check
        language: system
        pass_filenames: false
        # Each task checks the project, not only the staged files.
        files: '^(app/|tests/|config/|main\.py$|pixi\.(toml|lock)$|ruff\.toml$|\.pre-commit-config\.yaml$)'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        exclude: '\.gif$'
      - id: end-of-file-fixer
      - id: trailing-whitespace
