[workspace]
name = "chatcv"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
requires-pixi = ">=0.64.0"

[dependencies]
python = "3.12.*"
# Guardrails Hub uses pip internally for its optional validator installation.
pip = "*"

[pypi-dependencies]
fastapi = "*"
# main.py still uses the name/context-first TemplateResponse signature.
starlette = ">=0.46,<1"
uvicorn = "*"
# The application uses the pre-1.0 chains API.
langchain = ">=0.3,<0.4"
langchain-community = ">=0.3,<0.4"
langchain-chroma = ">=0.2,<0.3"
langchain-openai = ">=0.3,<0.4"
langchain-ollama = ">=0.3,<0.4"
pypdf = "*"
chromadb = "*"
python-dotenv = "*"
PyPDF2 = "*"
jinja2 = "*"
python-multipart = "*"
requests = "*"
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
PyYAML = ">=6.0"
gunicorn = "*"
httpx = ">=0.24.0"
langsmith = ">=0.1.0"
mlflow = ">=2.8.0"
guardrails-ai = "*"

[tasks]
start = "python -m uvicorn main:app --host 127.0.0.1 --port 8000"

[feature.dev.pypi-dependencies]
pytest = "*"
pytest-cov = "*"
pytest-mock = "*"
coverage = "*"
mypy = "*"
types-requests = "*"
types-PyYAML = "*"
ruff = "*"
black = "*"
isort = "*"
bandit = "*"
pre-commit = "*"

[feature.dev.tasks]
dev = "python -m uvicorn main:app --host 127.0.0.1 --port 8000 --reload"
test = { cmd = "python -m pytest tests/ -v", env = { LANGSMITH_TRACING = "false", ENVIRONMENT = "development" } }
test-cov = { cmd = "python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml", env = { LANGSMITH_TRACING = "false", ENVIRONMENT = "development" } }
lint = "ruff check app/ tests/ main.py"
format-check = "black --check app/ tests/ main.py"
format = "black app/ tests/ main.py"
typecheck = "mypy app/ --ignore-missing-imports"
security = "bandit -r app/"
check = { depends-on = ["test", "lint", "format-check", "typecheck", "security"] }

[environments]
default = { features = ["dev"], solve-group = "chatcv" }
runtime = { features = [], solve-group = "chatcv" }
