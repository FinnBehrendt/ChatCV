name: chatcv

services:
  # Application only; model servers are managed separately.
  chatcv:
    image: chatcv-app:latest-${ENVIRONMENT:-development}
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - source: guardrails_token
          target: guardrails_token
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CONVERSATION_MAX_TURNS: ${CONVERSATION_MAX_TURNS:-20}
      CONVERSATION_IDLE_MINUTES: ${CONVERSATION_IDLE_MINUTES:-30}
      CONVERSATION_CAPACITY: ${CONVERSATION_CAPACITY:-100}

secrets:
  guardrails_token:
    environment: GUARDRAILS_TOKEN
