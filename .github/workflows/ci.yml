name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.11.1
      with:
        pixi-version: v0.64.0
        environments: default
        locked: true
        cache: true

    - name: Lint with ruff
      run: pixi run --locked lint

    - name: Format check with black
      run: pixi run --locked format-check

    - name: Type check with mypy
      run: pixi run --locked typecheck

    - name: Security check with bandit
      run: pixi run --locked security

    - name: Run tests with pytest
      run: pixi run --locked test-cov --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build --secret id=guardrails_token,env=GUARDRAILS_TOKEN -t chatcv:latest .
      env:
        GUARDRAILS_TOKEN: ${{ secrets.GUARDRAILS_TOKEN }}

    - name: Test Docker image
      run: |
        docker run --rm -d --name chatcv-test -p 8000:8000 chatcv:latest
        sleep 10
        curl -f http://localhost:8000/health || exit 1
        docker stop chatcv-test
